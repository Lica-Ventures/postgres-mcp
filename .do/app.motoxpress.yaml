name: postgres-mcp-motoxpress
region: sgp
services:
  - name: mcp
    github:
      repo: Lica-Ventures/postgres-mcp
      branch: main
      deploy_on_push: true
    dockerfile_path: ./Dockerfile
    source_dir: .
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8000
    run_command: >
      postgres-mcp --transport=streamable-http --streamable-http-port=8000 --streamable-http-host=0.0.0.0 --access-mode=restricted
    envs:
      - key: ACCESS_MODE
        value: restricted
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_URI
        value: ${postgres-mcp-db.DATABASE_URL}
        scope: RUN_TIME
        type: GENERAL
      # Auth0 proxy mode — MCP server acts as OAuth AS, proxies to Auth0.
      # AUTH0_CLIENT_SECRET is intentionally declared without a value. Set it
      # once in the DO console after the app is created so the platform stores
      # it encrypted. Never commit the secret to this file.
      - key: AUTH0_CLIENT_ID
        value: vvqnZqU7L6so76X8egB4pLF92MkDff1y
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH0_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AUTH0_ISSUER_URL
        value: https://dev-1whgf1szbodvzfhk.us.auth0.com/
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH0_AUDIENCE
        value: https://mcp.licaventures.com
        scope: RUN_TIME
        type: GENERAL
      # ${APP_URL} and ${APP_DOMAIN} are resolved by App Platform at deploy
      # time. They point at the app's default *.ondigitalocean.app hostname
      # until a PRIMARY custom domain is added, then they follow that instead.
      # This keeps ALLOWED_HOSTS correct without hardcoding a hostname that is
      # unknown before the app exists.
      - key: MCP_RESOURCE_SERVER_URL
        value: ${APP_URL}/mcp
        scope: RUN_TIME
        type: GENERAL
      - key: MCP_REQUIRED_SCOPES
        value: mcp:use
        scope: RUN_TIME
        type: GENERAL
      - key: ALLOWED_HOSTS
        value: ${APP_DOMAIN}
        scope: RUN_TIME
        type: GENERAL
    health_check:
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 2
      failure_threshold: 4
      http_path: /.well-known/oauth-protected-resource/mcp
      port: 8000
# Custom domain. motoxpress.ph is delegated to DigitalOcean nameservers, so
# App Platform manages the CNAME and the TLS certificate itself.
# Note that motoxpress.com is NOT usable here: its nameservers point at
# Bluehost, so records added in the DigitalOcean panel for that zone never
# resolve.
# ALLOWED_HOSTS stays ${APP_DOMAIN}, which resolves to this PRIMARY domain once
# it is live, so the generated *.ondigitalocean.app hostname stops being an
# accepted Host and returns 403. The Auth0 Allowed Callback URL must therefore
# be https://mcp.motoxpress.ph/oauth/callback.
domains:
  - domain: mcp.motoxpress.ph
    type: PRIMARY
    zone: motoxpress.ph
databases:
  # NOTE: this binds the live primary, not a read-only replica. The mechanigo
  # and inventory apps each bind a replica (mechanigo-db-live-v2-read-only,
  # lica-inventory-db-live-readonly); the motoxpress team has no Postgres
  # replica yet. Read-only is still enforced by --access-mode=restricted, but
  # query load lands on the primary. Switch cluster_name to a replica once one
  # exists.
  - name: postgres-mcp-db
    engine: PG
    version: "18"
    production: true
    cluster_name: motoxpress-v2-api-live
    db_name: motoxpress-v2-api-live
    db_user: doadmin
